[package]
name = "aionpak-cli"
version.workspace = true
authors.workspace = true
edition = "2024"
license.workspace = true
description = "Extract, pack and optimise Aion client .pak archives"

[lib]
name = "aionpak_cli"
path = "src/lib.rs"

[[bin]]
name = "aionpak-cli"
path = "src/main.rs"

[dependencies]
aionpak-commons = { version = "1.0.0", path = "../aionpak-commons" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
indicatif = "0.18.6"
rayon = "1.12.0"

# musl's allocator serialises the worker threads; Windows and glibc keep the system one, which needs less memory.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[build-dependencies]
winresource = "0.1"
